; =====================================================================
;  Fennec v1.0 beta 配置文件
;  位置：与 Fennec.exe 同一目录，文件名必须是 fennec.ini
;
;  兜底规则（改错了也不会起不来）：
;   - 本文件缺失 / 为空 / 编码乱：整体按内置默认值运行，界面显示"未找到"
;   - 某项值无效（非数字 / 超出范围 / 单位拼错）：仅该项不生效，其余照常
;   - 未知键忽略；同一键写多次时最后一次生效
;   - 命令行参数（如 Fennec.exe 80 lan root=D:\www）优先级高于本文件；开关可写 lan / nolan / lan=0；Fennec-cli.exe help 查看全部
;   - 本文件保存后约 1 秒内自动热重载（无需重启）；端口 / 根目录 / lan / 线程数 / PHP 目录与
;     进程池大小等需要重启才生效，日志里会提示
;
;  语法说明：
;   - [节名] 对普通键仅作分组，键名全局唯一（放错节也照样生效）；
;     只有 [mime] 和 [headers] 两节按节解析（见文件末尾）
;   - 注释只能是整行，以 ; 或 # 开头；不支持行内注释
;   - 布尔值：1/0、true/false、yes/no、on/off（不分大小写）
;   - 时间值默认单位为秒，可加后缀：ms / s / m / h（如 1500ms、2m、1h）
;   - 大小值默认单位为 MB，可加后缀：B / KB / MB / GB（如 512KB、1GB）
;   - 编码：UTF-8（推荐，本文件即 UTF-8）/ UTF-16（记事本"Unicode"）/ ANSI 均可
; =====================================================================

[server]

; 监听端口（1-65535）。若被占用，自动依次尝试后续 19 个端口
port = 8080

; 网站根目录：留空 / . = exe 所在目录（默认）；相对路径 = 相对 exe 目录；
; 也可用绝对路径（如 D:\www，含空格可加引号）。目录必须存在，否则回退 exe 目录
root = ./wwwroot/public

; 1 = 监听所有网卡（局域网可访问）；0 = 仅本机 127.0.0.1
lan = 0

; IOCP 工作线程数（0-256）。0 = 自动（CPU 核数 + 2，上限 24）
threads = 0

; 最大并发连接数（16-1000000），超出直接关闭新连接
maxconn = 1000

; 空闲接收超时（1 秒 - 1 小时）：keep-alive 连接空闲超过此值断开。
; Keep-Alive 头里通告的超时与此值保持一致
idle_timeout = 15

; 发送 / 长响应超时（1 秒 - 24 小时）：大文件下载的全程上限（按进度刷新）
send_timeout = 120

; 请求头总时限（1 秒 - 10 分钟）：防 slowloris 慢速滴字攻击
header_timeout = 20

; 1 = 目录下没有默认主页时显示目录列表；0 = 回 403（同 nginx autoindex off）
dirlist = 0

; 默认主页（逗号分隔，最多 8 个，按顺序生效；目录下的 index.php
; 在此之前单独优先检查，无需写在这里）
index = index.html,index.htm,default.html,default.htm

[behavior]

; 1 = 允许跟随指向根目录之外的 junction/symlink（默认拦截，防越权读取）
follow = 0

; 1 = 伪静态：不存在的路径交给根目录的 index.php（WordPress/Laravel 等常用）
rewrite = 0

; 1 = 即使存在 php\php-cgi.exe 也不启用 PHP
nophp = 0

; 1 = 启动时不自动打开浏览器
nobrowser = 0

; 1 = 启动时最小化（min_to_tray=1 时直接进托盘，不显示窗口）
start_min = 0

; 1 = 点最小化按钮时隐藏窗口，只保留托盘图标（双击图标或右键 → 显示窗口恢复）；
; 0 = 照常缩到任务栏。点窗口右上角关闭按钮仍是退出程序。命令行 tray / notray 可覆盖
min_to_tray = 1

[php]

; PHP 目录：默认 php = 网站根目录的 php 子目录；相对路径始终相对网站根目录；
; 也可用绝对路径（如 E:\php-8.3）。指到根目录之外时该目录无法被 HTTP 访问（更安全）
php_dir = ./../../php-8.6

; 单个 PHP 脚本执行超时（1 秒 - 1 小时），CGI 与 FastCGI 两种模式都生效，
; 排队等待同样受此时限约束；超时回 504 并终止进程
php_timeout = 300

; 请求体上限（1MB - 1GB），超过回 413
php_max_body = 64

; PHP 脚本输出上限（1MB - 2GB），超过回 500 并终止进程
php_max_out = 512

; CGI 回退模式下同时运行的 php-cgi 进程数上限（1-64）。
; 注意这是逐请求 CGI 的上限；FastCGI 进程池用下面的 fcgi_* 配置
php_max_procs = 8

[fastcgi]

; FastCGI 进程池常驻 php-cgi 进程数（1-64），启动即拉起
fcgi_min_workers = 2

; 进程池上限（1-64）：所有进程忙且有请求排队时自动扩容到此值；
; 小于 fcgi_min_workers 时自动对调
fcgi_max_workers = 8

; 超出常驻数的空闲进程，空闲超过此时间后回收（10 秒 - 1 小时）
fcgi_idle_kill = 120

; 等待 php-cgi 开始监听的最长时间（1 秒 - 2 分钟）：php-cgi 冷启动
; （杀毒扫描等）超过此值则换端口重试
fcgi_spawn_timeout = 8

[security]

; 1 = 拒绝访问以 . 开头的文件/目录（.git / .env / .htaccess 等；.well-known 例外）
deny_dotfiles = 1

; 额外拒绝的名字（逗号分隔，最多 8 项，通配符 * ?，逐段匹配请求路径里的每个文件/目录名）。
; 无论是否配置，fennec.ini、本程序 exe 自身、日志文件（及日志专用目录）、php 目录都始终不可下载
;deny = *.bak,*.sql,node_modules

[logging]

; 访问日志（Common Log Format）与错误日志（5xx、PHP 进程池故障、配置问题等）。
; 相对路径基于 exe 目录，缺失的目录自动创建；留空 / off = 不写。
; 日志每秒落盘一次；超过 log_max_size 自动轮转为 xxx.1（只保留一份）
access_log = logs\access.log
error_log = logs\error.log
log_max_size = 50

[web]

; gzip 压缩：对 html/css/js/json/svg 等文本类型生效，静态文件的压缩结果带内存缓存。
; 压缩后反而更大的文件、Range 请求、脚本自己设了 Content-Encoding 的响应不压缩
gzip = 1

; 参与压缩的体积范围。注意不带单位时按 MB，所以最小值请写单位
gzip_min_size = 256B
gzip_max_size = 4MB

; 1 = 给所有响应加 Access-Control-Allow-Origin: *，并直接应答 CORS 预检（OPTIONS）
cors = 0

; 静态文件缓存时间（0 = no-cache，每次都校验 ETag / Last-Modified，开发最省心；
; 例如 1h 表示浏览器可直接复用 1 小时）
cache_max_age = 0

; 1 = 内置表和 [mime] 都没有的扩展名，再查 Windows 注册表（HKEY_CLASSES_ROOT\.ext 的 Content Type）。
; 默认关闭：注册表内容因机器而异，开启后同一个站点在不同电脑上可能返回不同的类型
mime_from_registry = 0

; 1 = 同一根目录 + 端口只允许运行一个实例，再次启动只会把已有窗口亮出来
single_instance = 1

; 1 = 本文件改动后自动热重载
hot_reload = 1

[https]

; 1 = 同时在 https_port 上提供 HTTPS（TLS 1.2，Windows Schannel）。HTTP 端口照常工作。
; 命令行也可写 https / nohttps。HTTPS 项修改后需重启才生效
https = 0

; HTTPS 监听端口（被占用时顺延 19 个，会跳过 HTTP 端口）
https_port = 8443

; HTTPS 并发连接上限（16..4096）。每个 TLS 连接占用一个线程（栈预留 256KB），
; 个人开发 / 内网使用默认 512 绰绰有余；改动需重启
https_max_conn = 512

; 证书：留空 = 首次启动自动生成自签名证书（RSA-2048 / SHA-256，3 年，SAN 含 localhost、
; 本机名、127.0.0.1、::1）。私钥放在当前用户的密钥容器里（不在网站目录），证书本体保存为
; exe 目录下的 cert\fennec.cer，之后每次启动复用同一张；把它导入"受信任的根证书颁发机构"
; 即可让浏览器不再警告（仅限你自己的机器）。
; 也可以指定自己的 PFX（含私钥，相对路径基于 exe 目录）。PFX 文件本身受保护，不可被下载。
; 提示：Windows 10 1709 之前的系统不认 OpenSSL 3 默认的 PFX 加密，导出时加 -legacy 即可
;ssl_cert = certs\my.pfx
;ssl_password = changeit

; ---------------------------------------------------------------------
; 以下两节按"节"解析（节名固定，其余节名仍只是分组）
; ---------------------------------------------------------------------

[mime]
; 扩展名 = 类型，覆盖或补充内置表（扩展名不分大小写，可带前导点；最多 128 条）
;webmanifest = application/manifest+json
;md = text/markdown; charset=utf-8

[headers]
; 名称 = 值，加到每个响应上（Content-Length / Content-Type / Connection / Date /
; Server / Content-Encoding 等由服务器管理的头不可覆盖）。总长度限 1000 字节
;X-Frame-Options = SAMEORIGIN
;Cross-Origin-Opener-Policy = same-origin
