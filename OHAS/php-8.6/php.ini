; OHAS / Fennec 便携环境配置（Windows 10+ x64）
; 仅加载项目实际使用的扩展；所有目录均使用相对路径或由应用自动设置。

[PHP]
engine = On
short_open_tag = Off
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
expose_php = Off

max_execution_time = 300
max_input_time = 60
max_input_vars = 5000
memory_limit = 256M

error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 4096
ignore_repeated_errors = Off
ignore_repeated_source = Off
html_errors = Off

variables_order = "GPCS"
request_order = "GP"
register_argc_argv = On
auto_globals_jit = On

default_mimetype = "text/html"
default_charset = "UTF-8"
date.timezone = "Asia/Shanghai"

file_uploads = On
upload_max_filesize = 32M
post_max_size = 64M
max_file_uploads = 20
allow_url_fopen = Off
allow_url_include = Off

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; 相对 php-cgi.exe 所在目录，迁移整个 server 目录后仍有效。
extension_dir = "ext"
extension = fileinfo
extension = gd
extension = mbstring
extension = pdo_sqlite
extension = zip

[Session]
session.save_handler = files
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_probability = 1
session.gc_divisor = 100
session.gc_maxlifetime = 7200
; session.save_path 由应用设为 wwwroot/storage/sessions。

[CGI]
; Fennec 负责限制可执行脚本位置；PATH_INFO 用于 /index.php/controller/action。
cgi.force_redirect = 0
cgi.fix_pathinfo = 1

[opcache]
; 此 PHP 构建已静态包含 Zend OPcache，不要再配置 zend_extension。
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
